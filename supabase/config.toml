# Nur die Einstellung für die Funktion amy-chat.
#
# verify_jwt = false: Die Funktion prüft die Anmeldung selbst, bei Supabase
# Auth und gegen ERLAUBTE_NUTZER. Die Prüfung durch die Plattform brächte
# nichts dazu: Sie lässt jede gültige Anmeldung durch, nicht nur die
# freigeschalteten.

[functions.amy-chat]
verify_jwt = false

# api-kosten: Andere Apps (Boxenstopp) melden ohne Anmeldung, sie weisen sich
# mit der Prüfsumme ihres Anthropic-Schlüssels aus (siehe handler.ts).
[functions.api-kosten]
verify_jwt = false
